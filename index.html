<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Calculadora R$ a USDT/VES</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #0d6efd;
        }
        .rate-box {
            background-color: #e9ecef;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 15px;
            color: #0f5132;
            font-weight: bold;
            border: 1px solid #d1e7dd;
        }
        .result-box {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }
        .result-text {
            flex-grow: 1;
            text-align: center;
        }
        .copy-btn {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .copy-btn:active {
            transform: scale(0.9);
        }
        .btn-action {
            width: 100%;
            background-color: #f8f9fa;
            border: 2px dashed #0d6efd;
            color: #0d6efd;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .donaciones-card {
            display: none; 
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #dee2e6;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 10px;
            border-radius: 6px;
            margin: 8px 0;
            border: 1px solid #eee;
        }
        .data-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Calculadora R$</h2>
        
        <div class="rate-box" id="tasaDisplay">Estableciendo tasa...</div>

        <div class="input-group">
            <label>Tasa VES/USDT hoy:</label>
            <input type="number" id="tasaManual" step="0.01" oninput="calcular()">
        </div>

        <div class="input-group">
            <label>Cantidad de R$:</label>
            <input type="number" id="cantidadR" placeholder="0" oninput="calcular()">
        </div>

        <div class="input-group">
            <label>Precio por cada 10,000 R$:</label>
            <input type="number" id="precio10k" step="0.01" placeholder="0.00" oninput="calcular()">
        </div>

        <div class="result-box">
            <div class="result-text">USDT: <span id="resultadoUSDT">0.00</span></div>
            <button class="copy-btn" onclick="copiarValor(document.getElementById('resultadoUSDT').innerText, this)">📋</button>
        </div>
        
        <div class="result-box" style="background-color: #fff3cd; color: #856404;">
            <div class="result-text">VES: <span id="resultadoVES">0.00</span></div>
            <button class="copy-btn" onclick="copiarValor(document.getElementById('resultadoVES').innerText, this)">📋</button>
        </div>

        <button class="btn-action" onclick="toggleDonaciones()">
            ☕ Apoyar desarrollo (Donar)
        </button>

        <div class="donaciones-card" id="seccionDonaciones">
            <p style="text-align: center; margin-top: 0;"><b>¡Gracias por tu apoyo! 💖</b></p>
            
            <small>Pago Móvil (BDV 0102)</small>
            <div class="data-row">
                <span class="data-text">V27594845</span>
                <button class="copy-btn" style="font-size: 14px;" onclick="copiarValor('27594845', this)">📋</button>
            </div>
            <div class="data-row">
                <span class="data-text">04144049598</span>
                <button class="copy-btn" style="font-size: 14px;" onclick="copiarValor('04144049598', this)">📋</button>
            </div>

            <small>Binance / Zinli</small>
            <div class="data-row">
                <span class="data-text" style="font-size: 12px;">nixonstyvenblanco@gmail.com</span>
                <button class="copy-btn" style="font-size: 14px;" onclick="copiarValor('nixonstyvenblanco@gmail.com', this)">📋</button>
            </div>
        </div>

        <button class="btn-action" style="border-color: #25D366; color: #25D366;" onclick="compartirWhatsApp()">
            📲 Compartir en WhatsApp
        </button>

    </div>

    <script>
        // CONFIGURACIÓN ADMINISTRADOR
        const TASA_DEL_DIA = 630.00; 

        function inicializar() {
            document.getElementById('tasaManual').value = TASA_DEL_DIA;
            document.getElementById('tasaDisplay').innerText = `✅ Tasa RECARGAMING: ${TASA_DEL_DIA} VES/USDT`;
            calcular();
        }

        function calcular() {
            const tasaVES = parseFloat(document.getElementById('tasaManual').value) || 0;
            const cantidadR = parseFloat(document.getElementById('cantidadR').value) || 0;
            const precio10k = parseFloat(document.getElementById('precio10k').value) || 0;

            const totalUSDT = (cantidadR / 10000) * precio10k;
            const totalVES = totalUSDT * tasaVES;

            document.getElementById('resultadoUSDT').innerText = totalUSDT.toFixed(2);
            document.getElementById('resultadoVES').innerText = totalVES.toFixed(2);
        }

        function toggleDonaciones() {
            const s = document.getElementById('seccionDonaciones');
            s.style.display = (s.style.display === "block") ? "none" : "block";
        }

        function copiarValor(t, b) {
            navigator.clipboard.writeText(t).then(() => {
                const old = b.innerText;
                b.innerText = "✅";
                setTimeout(() => b.innerText = old, 1500);
            });
        }

        function compartirWhatsApp() {
            const link = window.location.href; // Toma el enlace actual automáticamente
            const txt = encodeURIComponent(`¡Hola! 🎮 RECARGAMING te trae la nueva Calculadora R$ a USDT/VES. Rápida y sin anuncios molestos. 🚀\n\nPruébala aquí: ${link}`);
            window.open(`https://api.whatsapp.com/send?text=${txt}`, '_blank');
        }

        inicializar();
    </script>
</body>
</html>
