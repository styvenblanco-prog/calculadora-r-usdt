<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora R$ a USDT/VES</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .rate-box {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }
        .result-box {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Calculadora R$</h2>
        
        <div class="rate-box" id="tasaDisplay">
            Intentando conectar con el servidor...
        </div>

        <div class="input-group">
            <label for="tasaManual">Tasa VES/USDT (Binance P2P):</label>
            <input type="number" id="tasaManual" placeholder="Ej: 38.50" step="0.01" oninput="calcular()">
        </div>

        <div class="input-group">
            <label for="cantidadR">Cantidad de R$ a vender:</label>
            <input type="number" id="cantidadR" placeholder="Ej: 50000" oninput="calcular()">
        </div>

        <div class="input-group">
            <label for="precio10k">Precio en USDT por cada 10,000 R$:</label>
            <input type="number" id="precio10k" placeholder="Ej: 1.50" step="0.01" oninput="calcular()">
        </div>

        <div class="result-box">
            USDT: <span id="resultadoUSDT">0.00</span>
        </div>
        
        <div class="result-box" style="background-color: #fff3cd; color: #856404;">
            Bolívares (VES): <span id="resultadoVES">0.00</span>
        </div>
    </div>

    <script>
        // Súper Función Anti-Bloqueos (Nivel Profesional)
        async function obtenerTasa() {
            try {
                document.getElementById('tasaDisplay').innerText = '⏳ Conectando con servidores...';
                document.getElementById('tasaDisplay').style.color = "#555";

                let tasa = 0;

                // INTENTO 1: DolarApi Directo (El más rápido)
                try {
                    const res1 = await fetch('https://ve.dolarapi.com/v1/dolares/binance');
                    const data1 = await res1.json();
                    tasa = data1.promedio;
                } catch (error1) {
                    console.log("Fallo Intento 1. Probando Intento 2...");
                    
                    // INTENTO 2: Yadio a través de CodeTabs Proxy (El plan de respaldo blindado)
                    try {
                        const res2 = await fetch('https://api.codetabs.com/v1/proxy?quest=https://api.yadio.io/exrates/VES');
                        const data2 = await res2.json();
                        tasa = data2.USD.binance;
                    } catch (error2) {
                        // Si ambos fallan, forzamos el error para que salga el mensaje rojo
                        throw new Error("Todos los servidores bloqueados o caídos");
                    }
                }

                // Si logramos obtener la tasa, la mostramos triunfalmente
                if (tasa > 0) {
                    // Redondeamos a 2 decimales para mayor limpieza
                    document.getElementById('tasaManual').value = tasa.toFixed(2);
                    document.getElementById('tasaDisplay').innerText = '✅ Tasa P2P actualizada';
                    document.getElementById('tasaDisplay').style.color = "green";
                    calcular();
                }

            } catch (errorTotal) {
                // El escudo final: Si el internet simplemente no deja pasar nada
                document.getElementById('tasaDisplay').innerText = '⚠️ Usa la tasa manual (Servidores bloqueados)';
                document.getElementById('tasaDisplay').style.color = "red";
            }
        }

        // Ejecutar al abrir
        obtenerTasa();
    </script>

</body>
  </html>
